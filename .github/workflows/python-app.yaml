name: Python Tests

permissions:
  contents: read
  id-token: write  # OIDC token for AWS S3 model access

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ 
      github.repository == 'vijilAI/vijil-dome' && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      ) && 'LargerRunner' || 'ubuntu-latest' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      # - name: Cache Poetry dependencies
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.cache/pypoetry
      #       .venv
      #     key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-poetry-

      - name: Install dependencies from poetry project
        run: |
          poetry config virtualenvs.create false
          # Increase pip timeout to handle large packages
          export PIP_DEFAULT_TIMEOUT=300
          poetry install --no-interaction --no-root --all-extras
          # Install CPU-only PyTorch to avoid large CUDA dependencies in CI
          poetry run pip install --force-reinstall torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: poetry install --no-interaction

      - name: Install pytest
        run: poetry add pytest
      
      - name: Lint
        run: |
          export PYTHONPATH=$PWD
          poetry add ruff==0.15.17 mypy types-requests
          make lint

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::266735823956:role/github-actions-dome-ci
          aws-region: us-west-2

      - name: Sync detector models from S3
        run: |
          sudo mkdir -p /models
          sudo chown $USER /models
          # Whole models/ prefix. The detectors load from several orgs, not
          # just vijil/: protectai (deberta prompt-injection),
          # sentence-transformers (jailbreak embeddings), google/flan-t5-base
          # and vectara (hallucination), Dzeniks (factcheck), cooperleong00
          # (deberta toxicity). All are now mirrored into the bucket, so S3 is
          # a complete source and no detector needs the Hub.
          #
          # Excludes are the large generative models — no detector loads them
          # and they would dominate the transfer — plus .cache/**, which is
          # HuggingFace download bookkeeping rather than model content.
          aws s3 sync s3://vijil-inference/models/ /models/ \
            --exclude "*/.cache/*" \
            --exclude "*/gpt-oss-*" \
            --exclude "*/qwen*" \
            --exclude "*/glm*" \
            --exclude "*/gemma*" \
            --exclude "*/llama-3*"
          echo "Models synced:"
          ls -la /models/

      - name: Run tests
        env:
          VIJIL_MODEL_DIR: /models
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL_SECRET: ${{ secrets.OPENAI_BASE_URL }}
          VIJIL_LLM_MODEL_SECRET: ${{ secrets.VIJIL_LLM_MODEL }}
          TOGETHERAI_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          PERSPECTIVE_API_KEY: ${{ secrets.PERSPECTIVE_API_KEY }}
          # HUGGINGFACE_TOKEN removed: detector weights come from S3 only.
          # If a test starts failing for a missing model, the fix is to add it
          # to the bucket, not to restore this token.
        run: |
          # Only export OPENAI_BASE_URL / VIJIL_LLM_MODEL when the matching
          # secret is non-empty. Binding them directly via the env block sets
          # them to "" when the secret is unset (Actions store has no such
          # key on non-Dependabot runs), and openai-python treats "" as a
          # literal empty base URL rather than "use default" — producing
          # APIConnectionError on the moderations endpoint.
          if [ -n "$OPENAI_BASE_URL_SECRET" ]; then
            export OPENAI_BASE_URL="$OPENAI_BASE_URL_SECRET"
          fi
          if [ -n "$VIJIL_LLM_MODEL_SECRET" ]; then
            export VIJIL_LLM_MODEL="$VIJIL_LLM_MODEL_SECRET"
          fi
          export PYTHONPATH=$PWD
          make test
